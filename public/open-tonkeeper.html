<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Open Tonkeeper — SuperTom Deposit</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #050811;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #090e1c;
      border: 1px solid rgba(6, 182, 212, 0.4);
      border-radius: 24px;
      padding: 24px 20px;
      box-shadow: 0 0 35px rgba(6, 182, 212, 0.25);
      text-align: center;
    }
    .icon {
      width: 60px;
      height: 60px;
      margin: 0 auto 14px;
      background: linear-gradient(135deg, #0098EA, #0077B5);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(0, 152, 234, 0.45);
    }
    h1 { font-size: 19px; font-weight: 800; margin-bottom: 6px; letter-spacing: -0.3px; }
    p.sub { font-size: 12px; color: #94a3b8; margin-bottom: 18px; line-height: 1.4; }
    .amount-box {
      background: #040711;
      border: 1px solid rgba(6, 182, 212, 0.25);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 16px;
    }
    .amount-val { font-size: 26px; font-weight: 900; color: #38bdf8; font-family: monospace; letter-spacing: 0.5px; }
    .usd-val { font-size: 12px; color: #94a3b8; margin-top: 4px; font-weight: 600; }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 14px 16px;
      margin-bottom: 10px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-primary {
      background: linear-gradient(90deg, #0098EA, #00B4D8);
      color: #ffffff;
      box-shadow: 0 4px 20px rgba(0, 180, 216, 0.4);
    }
    .btn-primary:active { transform: scale(0.98); filter: brightness(1.1); }
    .btn-secondary {
      background: #0d162b;
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.35);
    }
    .btn-secondary:active { transform: scale(0.98); background: #132247; }
    .btn-outline {
      background: rgba(255, 255, 255, 0.04);
      color: #cbd5e1;
      border: 1px solid rgba(255, 255, 255, 0.12);
      font-size: 12px;
    }
    .details {
      background: #050811;
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 11px;
      text-align: left;
      margin-top: 14px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-family: monospace; }
    .row:last-child { margin-bottom: 0; }
    .label { color: #64748b; font-size: 10px; text-transform: uppercase; font-weight: 700; }
    .val { color: #f8fafc; font-weight: bold; word-break: break-all; max-width: 68%; text-align: right; }
    .status-badge {
      display: inline-block;
      margin-top: 8px;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      background: rgba(6, 182, 212, 0.15);
      color: #38bdf8;
      border: 1px solid rgba(6, 182, 212, 0.3);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="#ffffff">
        <path d="M12 2L3 8.5L12 22L21 8.5L12 2ZM12 4.5L17.5 9H6.5L12 4.5ZM5.5 10.5H10.5V17.5L5.5 10.5ZM13.5 17.5V10.5H18.5L13.5 17.5Z"/>
      </svg>
    </div>
    <h1>Opening Tonkeeper...</h1>
    <p class="sub">Pre-filling payment details in your TON wallet. If Tonkeeper doesn't open automatically, tap the button below.</p>

    <div class="amount-box">
      <div id="tonAmount" class="amount-val">-- TON</div>
      <div id="usdAmount" class="usd-val">≈ $0.00 USD</div>
      <div id="statusBadge" class="status-badge">Launching Wallet...</div>
    </div>

    <!-- Direct Launch Button -->
    <button id="launchTonkeeperBtn" class="btn btn-primary" type="button">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
        <polyline points="15 3 21 3 21 9"></polyline>
        <line x1="10" y1="14" x2="21" y2="3"></line>
      </svg>
      <span>Open in Tonkeeper App</span>
    </button>

    <!-- Alternative TON Wallet Scheme -->
    <a id="launchTonSchemeBtn" href="#" class="btn btn-secondary">
      <span>Open with TON Wallet (ton://)</span>
    </a>

    <!-- Telegram Wallet Option -->
    <a id="launchTelegramWalletBtn" href="https://t.me/wallet" target="_blank" class="btn btn-outline">
      <span>Open in Telegram @wallet</span>
    </a>

    <!-- Copy All Details -->
    <button id="copyDetailsBtn" class="btn btn-outline" type="button">
      <span>Copy Payment Details</span>
    </button>

    <!-- Details Card -->
    <div class="details">
      <div class="row">
        <span class="label">Recipient:</span>
        <span id="addrVal" class="val" style="font-size: 10px;">--</span>
      </div>
      <div class="row">
        <span class="label">Comment / Memo:</span>
        <span id="memoVal" class="val" style="color: #fbbf24;">--</span>
      </div>
    </div>
  </div>

  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      var address = params.get('address') || 'UQBGdgDogsxtpbFIvzAFnIByU3E3PlXsdkt_xyuG4S-gzvgR';
      var amountNano = params.get('amount') || '1000000000';
      var memo = params.get('text') || params.get('memo') || 'DEP-PAYMENT';
      var usd = params.get('usd') || '';

      var tonFloat = '1.0000';
      try {
        var nanoBig = BigInt(amountNano.split('.')[0] || '0');
        var wholeTon = nanoBig / 1000000000n;
        var fracTon = (nanoBig % 1000000000n).toString().padStart(9, '0');
        tonFloat = wholeTon.toString() + '.' + fracTon.slice(0, 4);
      } catch(e) {
        tonFloat = (Number(amountNano) / 1000000000).toFixed(4);
      }
      document.getElementById('tonAmount').innerText = tonFloat + ' TON';
      if (usd) {
        document.getElementById('usdAmount').innerText = '≈ $' + Number(usd).toFixed(2) + ' USD';
      } else {
        var approxUsd = (Number(tonFloat) * 5.20).toFixed(2);
        document.getElementById('usdAmount').innerText = '≈ $' + approxUsd + ' USD';
      }

      document.getElementById('addrVal').innerText = address;
      document.getElementById('memoVal').innerText = memo;

      // Encoded parameters for TON transfer
      var encodedMemo = encodeURIComponent(memo);
      var tonDeepLink = 'ton://transfer/' + address + '?amount=' + amountNano + '&text=' + encodedMemo;
      var tonkeeperDeepLink = 'tonkeeper://transfer/' + address + '?amount=' + amountNano + '&text=' + encodedMemo;
      var keeperDeepLink = 'keeper://transfer/' + address + '?amount=' + amountNano + '&text=' + encodedMemo;
      var universalWebLink = 'https://app.tonkeeper.com/transfer/' + address + '?amount=' + amountNano + '&text=' + encodedMemo;

      // Android Intent scheme targeting com.ton_keeper
      var androidIntentTonkeeper = 'intent://transfer/' + address + '?amount=' + amountNano + '&text=' + encodedMemo + '#Intent;scheme=tonkeeper;package=com.ton_keeper;end';
      var androidIntentTon = 'intent://transfer/' + address + '?amount=' + amountNano + '&text=' + encodedMemo + '#Intent;scheme=ton;package=com.ton_keeper;end';

      var ua = navigator.userAgent || '';
      var isAndroid = /android/i.test(ua);
      var isIOS = /iphone|ipad|ipod/i.test(ua);

      var launchBtn = document.getElementById('launchTonkeeperBtn');
      var tonSchemeBtn = document.getElementById('launchTonSchemeBtn');
      var copyBtn = document.getElementById('copyDetailsBtn');
      var statusBadge = document.getElementById('statusBadge');

      tonSchemeBtn.href = tonDeepLink;

      function triggerOpen() {
        statusBadge.innerText = 'Opening Tonkeeper...';
        if (isAndroid) {
          // Attempt 1: Android Intent for Tonkeeper
          window.location.href = androidIntentTonkeeper;
          setTimeout(function() {
            window.location.href = tonkeeperDeepLink;
          }, 350);
          setTimeout(function() {
            window.location.href = tonDeepLink;
          }, 700);
        } else if (isIOS) {
          // iOS Tonkeeper custom scheme
          window.location.href = tonkeeperDeepLink;
          setTimeout(function() {
            window.location.href = tonDeepLink;
          }, 400);
        } else {
          // Desktop / Fallback
          window.location.href = tonkeeperDeepLink;
          setTimeout(function() {
            window.location.href = universalWebLink;
          }, 600);
        }
      }

      launchBtn.addEventListener('click', function(e) {
        e.preventDefault();
        triggerOpen();
      });

      copyBtn.addEventListener('click', function() {
        var copyText = 'TON Recipient: ' + address + '\nAmount: ' + tonFloat + ' TON (' + amountNano + ' nanoTON)\nComment/Memo: ' + memo;
        if (navigator.clipboard) {
          navigator.clipboard.writeText(copyText).then(function() {
            copyBtn.innerText = 'Copied to Clipboard!';
            setTimeout(function() { copyBtn.innerText = 'Copy Payment Details'; }, 2000);
          });
        } else {
          var input = document.createElement('textarea');
          input.value = copyText;
          document.body.appendChild(input);
          input.select();
          document.execCommand('copy');
          document.body.removeChild(input);
          copyBtn.innerText = 'Copied to Clipboard!';
          setTimeout(function() { copyBtn.innerText = 'Copy Payment Details'; }, 2000);
        }
      });

      // Auto-trigger on page load
      setTimeout(function() {
        triggerOpen();
      }, 150);
    })();
  </script>
</body>
</html>
