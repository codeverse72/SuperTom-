    <!-- Adsgram Telegram Mini App Ads SDK (Approved Unit: 59392) -->
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <!-- Adexium Telegram Mini App Ads SDK -->
    <script type="text/javascript" src="https://cdn.tgads.space/assets/js/adexium-widget.min.js"></script>
    <script type="text/javascript">
      (function() {
        var wid = 'b073a77c-3963-43dc-a846-99b5382cd341';
        var isAdmin = window.location.pathname.startsWith('/admin') ||
                      window.location.hash.startsWith('#/admin') ||
                      window.location.search.includes('admin=true');
        if (isAdmin) return;

        function initAdexium() {
          if (window.__adexiumWidget) return;
          try {
            if (typeof AdexiumWidget !== 'undefined') {
              var adexiumWidget = new AdexiumWidget({ wid: wid, adFormat: 'interstitial' });
              window.adexiumWidget = adexiumWidget;
              window.__adexiumWidget = adexiumWidget;
              console.log('[Adexium] Placement #15008 ready for watch ad quests');
            }
          } catch (err) {
            console.warn('[Adexium] Init attempt skipped/retrying:', err);
          }
        }

        if (document.readyState === 'complete' || document.readyState === 'interactive') {
          initAdexium();
        } else {
          document.addEventListener('DOMContentLoaded', initAdexium);
        }
        window.addEventListener('load', initAdexium);

        // Retry every 400ms for up to 6 seconds to ensure Telegram WebApp context is fully loaded
        var attempts = 0;
        var interval = setInterval(function() {
          attempts++;
          if (window.__adexiumWidget || attempts > 15) {
            clearInterval(interval);
            return;
          }
          initAdexium();
        }, 400);
      })();
    </script>
